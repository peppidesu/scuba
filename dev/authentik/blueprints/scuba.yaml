# Provisions the OIDC login for scuba (dev only). Applied automatically by authentik at startup.
# Values come from the environment of the authentik containers (see dev/compose.yaml).
version: 1
metadata:
  name: scuba (dev)
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: scuba-provider
    identifiers:
      name: scuba
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: scuba
      client_secret: !Env SCUBA_OIDC_CLIENT_SECRET
      grant_types: [authorization_code, refresh_token]   # empty by default in recent authentik: all logins would fail
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/auth/callback", !Env SCUBA_URL]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers:
      slug: scuba
    attrs:
      name: scuba
      provider: !KeyOf scuba-provider
      meta_launch_url: !Env SCUBA_URL

  # two ordinary users for trying out ownership conflicts (password: dev)
  - model: authentik_core.user
    identifiers:
      username: alice
    attrs:
      name: Alice
      email: alice@example.com
      password_hash: "pbkdf2_sha256$1000000$UJzyoqczISfCpFk2Pfit9f$GHcO1H0URSqwh2fHqZqvveEKtKEVORORah7M85F+MBM="
  - model: authentik_core.user
    identifiers:
      username: bob
    attrs:
      name: Bob
      email: bob@example.com
      password_hash: "pbkdf2_sha256$1000000$UJzyoqczISfCpFk2Pfit9f$GHcO1H0URSqwh2fHqZqvveEKtKEVORORah7M85F+MBM="
