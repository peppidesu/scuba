# DEV ONLY. Combined NetBird server; everything is reached through the edge proxy at :8080.
server:
  listenAddress: ":80"
  exposedAddress: "http://localhost:8080"
  stunPorts:
    - 3478
  metricsPort: 9090
  healthcheckAddress: ":9000"
  logLevel: "info"
  logFile: "console"

  authSecret: "dev-relay-secret-not-for-production"
  dataDir: "/var/lib/netbird"

  auth:
    issuer: "http://localhost:8080/oauth2"
    signKeyRefreshEnabled: true
    sessionCookieEncryptionKey: "WU8ZFjlGQg+eDyXwIA1aomAU77RqMLY6RpqdHvB/j7M="
    dashboardRedirectURIs:
      - "http://localhost:8080/nb-auth"
      - "http://localhost:8080/nb-silent-auth"
    cliRedirectURIs:
      - "http://localhost:53000/"

  store:
    engine: "sqlite"
    encryptionKey: "tURePuWa+m8DcKgiZSEWkqNYULXkvhDNV8pomINGUyU="
