[package]
name = "scuba"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
axum-folder-router = { version = "0.4.1", features = ["nightly"] }
axum-htmx = "0.8.1"
axum-login = "0.18.0"
maud = { version = "0.27.0", features = ["axum"] }
openidconnect = "4.0.1"
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tower-sessions = "0.14"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
reqwest = { version = "0.13.5", features = ["cookies"] }
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
codegen-units = 1
opt-level = 3
lto = "thin"
